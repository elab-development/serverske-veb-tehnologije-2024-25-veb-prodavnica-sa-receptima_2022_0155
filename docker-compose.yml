version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: recipesshop-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: recipesshop
      MYSQL_USER: recipesshop
      MYSQL_PASSWORD: recipesshop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - appnet
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: recipesshop-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - appnet
  backend:
    build:
      context: ./recipesshop
      dockerfile: Dockerfile
    container_name: recipesshop-backend
    restart: unless-stopped
    volumes:
      - ./recipesshop:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recipesshop-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet: